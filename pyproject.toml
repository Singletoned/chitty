[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chitty"
dynamic = ["version"]
description = "Markdown-native task tracker for repos worked on by humans and coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ed Singleton", email = "ed@singletoned.com" }]
keywords = ["task-tracker", "markdown", "cli", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click",
    "markdown-it-py>=3.0.0",
    "pydantic",
    "pyyaml",
]

[tool.hatch.version]
path = "src/chitty/__init__.py"

[project.urls]
Homepage = "https://github.com/Singletoned/chitty"
Issues = "https://github.com/Singletoned/chitty/issues"

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
chitty = "chitty.cli:main"

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "mdformat==0.7.22",
    "mdformat-frontmatter==2.0.8",
    "mdformat-gfm==0.4.1",
    "hypothesis",
    "pyright",
    "ruff",
    "types-PyYAML",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
]

[tool.coverage.run]
branch = true
source = ["src/chitty"]
patch = ["subprocess"]
data_file = "${COVERAGE_ROOT-.}/.coverage"

[tool.ruff]
# Ticket files are prose; a Python snippet in one must not fail `make check`.
extend-exclude = ["chitty"]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "I", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["chitty"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src"]
