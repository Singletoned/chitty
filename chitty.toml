format = 1
default_context = "tasks"
autocommit = true
setup = "make install"
# Run the agent with this worktree's `.venv` first on `PATH`, so a bare `chitty`
# is the branch's code, not whichever global install comes first. The `env -u`
# stops an exported `UV_PROJECT_ENVIRONMENT` sending `uv run` to the shared one.
agent_command = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync pi --no-extensions -e ~/.pi/agent/extensions/chitty.ts --no-skills --skill ~/.pi/agent/skills/python-dev --chitty-{mode} {id}"

project = "chitty"
archive = "move"
review = true

chitty_version = "0.1.30"
[contexts.tasks]
prefix = "TASK"

[contexts.human]
prefix = "HUMAN"
review = false

[agent_commands]
claude = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync claude -p {prompt} --model sonnet --permission-mode dontAsk --allowedTools 'Read Edit Write Bash(chitty *) Bash(git *) Bash(make *) Bash(uv run *) Bash(python *) Bash(npm test*) Bash(rg *) Bash(head *) Bash(grep *) Bash(find *) Bash(sort *) Bash(tail *) Bash(sed *) Bash(nl *) Bash(awk *) Bash(cat *) Bash(ls *) Bash(wc *)' --disallowedTools 'Bash(git push *)'"
