format = 1
default_context = "tasks"
autocommit = true
setup = "make install"
check = "make check"
# Run the agent with this worktree's `.venv` first on `PATH`, so a bare `chitty`
# is the branch's code, not whichever global install comes first. The `env -u`
# stops an exported `UV_PROJECT_ENVIRONMENT` sending `uv run` to the shared one.
agent_command = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync pi --no-extensions -e ~/.pi/agent/extensions/chitty.ts --no-skills --skill ~/.pi/agent/skills/python-dev --chitty-{mode} {id}"

project = "chitty"
archive = "move"
review = true

list_width = 80

chitty_version = "0.1.47"
# work_model = "provider/model" # default for work sessions
# review_model = "provider/model" # default for review sessions

[contexts.tasks]
prefix = "TASK"

[contexts.human]
prefix = "HUMAN"
review = false

[contexts.backlog]
prefix = "BACKLOG"
random_ids = true

[agent_commands]
# Trial (2026-11-10): Pi without its interface or the chitty.ts extension.
pi-print = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync pi -p --no-extensions --no-skills --skill ~/.pi/agent/skills/python-dev {prompt}"
# Unrestricted inside the worktree (the human decided, 2026-11-10); `git push` stays denied.
claude = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync claude -p {prompt} --model haiku --permission-mode bypassPermissions --disallowedTools 'Bash(git push *)'"
