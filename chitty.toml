format = 1
default_context = "tasks"
autocommit = true
setup = "make install"
# Run the agent with this worktree's `.venv` first on `PATH`, so a bare `chitty`
# is the branch's code, not whichever global install comes first. The `env -u`
# stops an exported `UV_PROJECT_ENVIRONMENT` sending `uv run` to the shared one.
agent_command = "env -u VIRTUAL_ENV -u UV_PROJECT_ENVIRONMENT uv run --no-sync pi --no-extensions -e ~/.pi/agent/extensions/chitty.ts --no-skills --skill ~/.pi/agent/skills/python-dev --chitty-{mode} {id}"

project = "chitty"
archive = "move"
review = true

chitty_version = "0.1.27"
[contexts.tasks]
prefix = "TASK"

[contexts.human]
prefix = "HUMAN"
review = false
